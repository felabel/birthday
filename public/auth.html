<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepsake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600;1,9..144,700&family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <style>
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(900px 600px at 80% 0%, #fbd3dc, transparent 60%), radial-gradient(700px 500px at 0% 100%, #fde3d6, transparent 60%), var(--bg); }
    .card { width: min(100%, 420px); background: var(--paper); border-radius: 28px; padding: 40px 32px; box-shadow: var(--shadow);
      animation: in 1.2s var(--ease) both; }
    @keyframes in { from { opacity: 0; transform: translateY(30px) scale(.97); filter: blur(6px); } }
    .brand { display: block; text-align: center; margin-bottom: 6px; font-size: 36px; }
    h1 { font-size: 38px; text-align: center; margin-bottom: 26px; }
    .err { color: #c0392b; font-size: 14px; min-height: 20px; margin: 0 0 10px; }
    .switch { text-align: center; font-size: 14px; color: var(--ink-soft); margin-top: 18px; }
    .btn { width: 100%; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <a class="brand" href="/">Keepsake</a>
    <h1 id="title">Create your account</h1>
    <div class="field" id="name-field"><label for="name">Your name</label><input class="input" id="name" autocomplete="name"></div>
    <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" minlength="6" required></div>
    <p class="err" id="err"></p>
    <button class="btn" type="submit" id="submit">Sign up</button>
    <p class="switch" id="switch"></p>
  </form>
  <script src="/app.js"></script>
  <script>
    const isLogin = location.pathname === '/login';
    const $ = (id) => document.getElementById(id);
    document.title = (isLogin ? 'Log in' : 'Sign up') + ' — Keepsake';
    $('title').textContent = isLogin ? 'Welcome back' : 'Create your account';
    $('submit').textContent = isLogin ? 'Log in' : 'Sign up';
    $('password').autocomplete = isLogin ? 'current-password' : 'new-password';
    if (isLogin) $('name-field').remove(); else $('name').required = true;
    $('switch').innerHTML = isLogin ? 'New here? <a href="/signup">Create an account</a>' : 'Already have an account? <a href="/login">Log in</a>';

    api('/api/me').then(({ user }) => { if (user) location.replace('/dashboard'); }).catch(() => {});

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('err').textContent = ''; $('submit').disabled = true;
      try {
        await api(isLogin ? '/api/login' : '/api/signup', { method: 'POST', body: {
          name: $('name')?.value, email: $('email').value, password: $('password').value,
        } });
        location.href = '/dashboard';
      } catch (err) { $('err').textContent = err.message; $('submit').disabled = false; }
    });
  </script>
</body>
</html>
