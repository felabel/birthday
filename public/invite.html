<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave a birthday message ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600;1,9..144,700&family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <style>
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; overflow-x: hidden;
      background:
        radial-gradient(900px 600px at 85% -10%, color-mix(in srgb, var(--accent-2) 50%, transparent), transparent 60%),
        radial-gradient(700px 500px at 0% 100%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
    }
    .doodles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .doodle { position: absolute; pointer-events: auto; cursor: pointer; }
    .doodle svg { width: 100%; height: auto; display: block; overflow: visible; fill: none; stroke: var(--doodle); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    svg .f { fill: var(--doodle); stroke: none; } svg .w { fill: var(--paper); }
    .wig { animation: boil .7s steps(1) infinite; }
    .wig.word { font-family: var(--script); font-weight: 700; color: var(--doodle); white-space: nowrap; line-height: 1; }
    @keyframes boil { 0% { transform: rotate(-4deg); } 33% { transform: rotate(3deg) translate(1px, -1px); } 66% { transform: rotate(-1deg) translate(-1px, 1px); } }

    .sheet {
      position: relative; z-index: 1; width: min(100%, 520px); background: var(--paper);
      border: 3px solid var(--doodle); border-radius: 28px; padding: clamp(26px, 6vw, 44px);
      box-shadow: 10px 12px 0 color-mix(in srgb, var(--doodle) 85%, transparent);
      animation: pop 1s var(--ease) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(30px) rotate(-2deg) scale(.95); } }
    .tag { display: inline-block; font: 700 12px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
      background: color-mix(in srgb, var(--accent-2) 30%, transparent); padding: 6px 12px; border-radius: 999px; margin-bottom: 18px; }
    h1 { font-size: clamp(34px, 7vw, 50px); }
    h1 .name { font-family: var(--script); color: var(--accent); font-size: 1.25em; font-weight: 700; display: inline-block; rotate: -3deg; }
    .lead { color: var(--ink-soft); margin: 14px 0 26px; }
    .secret { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-soft); margin: 18px 0 0; }
    textarea.input { min-height: 150px; }
    .btn { width: 100%; font-size: 16px; padding: 1em; }
    .count { text-align: right; font-size: 12px; color: var(--ink-soft); margin-top: -10px; margin-bottom: 14px; }
    .err { color: #c0392b; font-size: 14px; min-height: 20px; margin: 0 0 8px; }

    .done { text-align: center; }
    .done .big { font: 700 clamp(52px, 12vw, 76px)/1 var(--script); color: var(--accent); margin: 6px 0 10px; display: block; }
    .envelope-mini { width: 120px; margin: 0 auto 10px; }
    .envelope-mini svg { width: 100%; fill: none; stroke: var(--doodle); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .preview { text-align: left; background: color-mix(in srgb, var(--accent-2) 14%, var(--paper)); border-radius: 18px; padding: 18px 20px; margin: 22px 0;
      font-family: var(--serif); font-weight: 500; font-size: 18px; line-height: 1.5; rotate: -1deg; }
    .preview .who { display: block; font: 700 24px var(--script); color: var(--accent); margin-top: 6px; }
    .closed { text-align: center; }
  </style>
</head>
<body>
  <div class="doodles" id="doodles" aria-hidden="true"></div>
  <main class="sheet" id="sheet" aria-live="polite">
    <p style="text-align:center;color:var(--ink-soft)">Loading…</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/app.js"></script>
  <script src="/doodles.js"></script>
  <script>
    (async () => {
      const token = location.pathname.split('/').pop();
      const sheet = document.getElementById('sheet');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let info;
      try { info = await api(`/api/invite/${token}`); }
      catch (err) { return show(closedView('Hmm, this invite link isn\'t working', err.message)); }

      document.documentElement.dataset.theme = info.theme || 'rose';
      const who = info.recipient || 'them';
      document.title = `Leave a birthday message for ${who} ♥`;
      scatterDoodles();
      if (!info.open) return show(closedView('Messages are closed', `${info.sender || 'The card maker'} isn't collecting messages for ${who} right now.`));
      show(formView());

      function show(node) { sheet.replaceChildren(node); if (window.gsap && !reduced) gsap.from(node.children, { y: 24, opacity: 0, stagger: .08, duration: .9, ease: 'expo.out' }); }

      function formView() {
        const name = el('input', { class: 'input', id: 'name', maxlength: 60, required: true, autocomplete: 'name', placeholder: 'e.g. Auntie Grace' });
        const text = el('textarea', { class: 'input', id: 'text', maxlength: 800, required: true, placeholder: `Write something sweet (or silly) for ${who}…` });
        const count = el('div', { class: 'count' }, '0 / 800');
        const err = el('p', { class: 'err' });
        const btn = el('button', { class: 'btn', type: 'submit' }, 'Send my message ♥');
        text.addEventListener('input', () => (count.textContent = `${text.value.length} / 800`));
        const form = el('form', {},
          el('span', { class: 'tag' }, 'You\'re invited ✶'),
          el('h1', {}, 'Add a birthday message for ', el('span', { class: 'name' }, who)),
          el('p', { class: 'lead' }, `${info.sender || 'Someone'} is making a surprise birthday card for ${who}. Leave a little note and it'll be waiting inside when they open it.`),
          el('div', { class: 'field' }, el('label', { for: 'name' }, 'Your name'), name),
          el('div', { class: 'field' }, el('label', { for: 'text' }, 'Your message'), text),
          count, err, btn,
          el('p', { class: 'secret' }, '🤫', el('span', {}, 'Shh, keep it a secret until the big day!')));
        form.addEventListener('submit', async (e) => {
          e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Sending…';
          try {
            const { message } = await api(`/api/invite/${token}/messages`, { method: 'POST', body: { name: name.value, text: text.value } });
            show(doneView(message));
            celebrate();
          } catch (ex) { err.textContent = ex.message; btn.disabled = false; btn.textContent = 'Send my message ♥'; }
        });
        return form;
      }

      function doneView(message) {
        const env = el('div', { class: 'envelope-mini', 'aria-hidden': 'true' });
        env.innerHTML = '<svg viewBox="0 0 100 74"><rect x="6" y="8" width="88" height="58" rx="8" style="fill:var(--paper)"/><path d="M9 12 L50 42 L91 12"/><path d="M50 60 C38 51 34 45 36 40 C38 35 46 34 50 40 C54 34 62 35 64 40 C66 45 62 51 50 60Z" style="fill:var(--accent);stroke:var(--doodle)"/></svg>';
        return el('div', { class: 'done' },
          env,
          el('span', { class: 'big' }, 'Sent!'),
          el('p', { class: 'lead', style: 'margin:0' }, `Your message is tucked safely inside ${who}'s card. They'll see it on their birthday.`),
          el('div', { class: 'preview' }, message.text, el('span', { class: 'who' }, `— ${message.name}`)),
          el('button', { class: 'btn ghost', onclick: () => show(formView()) }, 'Write another message'));
      }

      function closedView(title, body) {
        return el('div', { class: 'closed' },
          el('h1', { style: 'font-size:34px;margin-bottom:12px' }, title),
          el('p', { class: 'lead' }, body),
          el('a', { class: 'btn ghost', href: '/' }, 'Make your own card'));
      }

      function scatterDoodles() {
        const layer = document.getElementById('doodles');
        const narrow = innerWidth < 700;
        const spots = narrow
          ? [[3, 3, 'blob'], [78, 2, 'balloon'], [4, 90, 'cat'], [76, 91, 'word:hbd!!']]
          : [[6, 8, 'blob'], [86, 6, 'balloon'], [4, 46, 'word:hbd!!'], [88, 44, 'star'], [8, 80, 'cat'], [84, 82, 'party'], [46, 2, 'word:shh!!']];
        spots.forEach(([x, y, kind]) => {
          const size = (narrow ? 50 : 84) * (kind.startsWith('word:') ? 1.5 : 1);
          const d = makeDoodle(kind, size);
          Object.assign(d.style, { left: `${x}%`, top: `${y}%` });
          boop(d);
          layer.append(d);
          if (window.gsap && !reduced) {
            gsap.from(d, { scale: 0, rotation: -90, duration: 1, ease: 'back.out(2.5)', delay: .4 + Math.random() * .6 });
            gsap.to(d, { x: `+=${Math.random() * 40 - 20}`, y: `+=${Math.random() * 30 - 15}`, rotation: Math.random() * 24 - 12,
              duration: 4 + Math.random() * 4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
          }
        });
      }

      function celebrate() {
        if (!window.gsap || reduced) return;
        const colors = ['--accent', '--accent-2', '--gold'].map((v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
        const r = sheet.getBoundingClientRect();
        for (let i = 0; i < 26; i++) {
          const h = el('span', { 'aria-hidden': 'true', style: `position:fixed;left:${r.left + r.width / 2}px;top:${r.top + 80}px;z-index:5;pointer-events:none;font-size:${14 + Math.random() * 18}px;color:${colors[i % 3]}` }, '♥');
          document.body.append(h);
          gsap.to(h, { x: (Math.random() - .5) * 520, y: -120 - Math.random() * 260, rotation: (Math.random() - .5) * 120, opacity: 0,
            duration: 1.6 + Math.random(), ease: 'power2.out', onComplete: () => h.remove() });
        }
        gsap.fromTo(sheet, { rotate: -2, scale: .97 }, { rotate: 0, scale: 1, duration: 1, ease: 'elastic.out(1, .5)' });
      }
    })();
  </script>
</body>
</html>
